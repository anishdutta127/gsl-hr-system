name: a11y

# axe-core sweep on push to main (after Vercel deploy completes). Scans
# public + auth-landing surfaces on the deployed URL. Baseline lives in
# .axe-baseline.json — CI fails if violations exceed the baseline.
#
# Runs on hosted ubuntu-latest. The cost is ~1 minute per run + the
# playwright chromium download (cached between runs).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      baseUrl:
        description: 'Base URL to scan (override for preview deploys)'
        required: false
        default: 'https://gsl-hr-system.vercel.app'

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pw-${{ runner.os }}-

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # Give Vercel a moment to finish its deploy of this commit before
      # we scan. 45s is a typical Next 14 build on Hobby.
      - name: Wait for Vercel deploy
        if: github.event_name == 'push'
        run: sleep 45

      - name: Run axe-core against deployed URL
        env:
          A11Y_BASE_URL: ${{ github.event.inputs.baseUrl || 'https://gsl-hr-system.vercel.app' }}
        run: npm run a11y

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
